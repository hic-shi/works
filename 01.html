<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信号機と相席純喫茶</title>
    <style>
        /* カラー変数を定義（最大5色） */
        :root {
            --bg-color: #c0a246;         /* 1. 全体背景 */
            --card-bg: #ffffff;          /* 2. カード・コンテンツ背景 */
            --text-color: #333333;       /* 3. 基本テキスト */
            --text-sub: #888888;         /* 4. サブテキスト（日付など） */
            --accent-color: #7a5c10;     /* 5. リンク・アクセントカラー */
        }

        * {
            box-sizing: border-box; /* パディングや枠線による幅崩れを完全に防ぐ */
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            font-family: Arial, sans-serif;
            color: var(--text-color);
        }

        /* 全体レイアウト用コンテナ（確実に左右横並びにする） */
        .layout-container {
            display: flex;
            flex-direction: row;        /* 確実に横並び指定 */
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;             /* 画面中央に配置 */
            gap: 20px;                  /* 左右の隙間 */
            align-items: flex-start;    /* 高さを揃えず上揃えにする */
        }

        /* 左側：作品リンク一覧（幅を固定／追尾なし） */
        .sidebar-left {
            width: 220px;
            flex-shrink: 0;             /* 右側の圧迫で潰れないように固定 */
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
        }

        .sidebar-left h2 {
            font-size: 16px;
            margin-top: 0;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 8px;
        }

        .sidebar-left ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-left li {
            margin-bottom: 12px;
        }

        .sidebar-left a {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .sidebar-left a:hover {
            text-decoration: underline;
        }

        .sticky-header h1 {
            margin: 0;
            font-size: 20px;
        }

        .sticky-header nav a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }

        /* メイン作品エリア #m */
        #m {
            background-color: var(--card-bg);
            border: 10px solid var(--card-bg);
            padding: 20px;
            border-radius: 8px;
        }

        #dete {
            text-align: right;
            font-size: 12px;
            color: var(--text-sub);
        }

        .ma {
            display: block;
            width: 60%;
            max-width: 100%;
            height: auto;
            margin: 20px auto;
        }
    </style>
</head>
<body>

    <!-- 全体コンテナ（左右2カラム） -->
    <div class="layout-container category">
            <!-- メインコンテンツ #m -->
            <article id="m" class="category">
                <h1>信号機と相席純喫茶</h1>
                <p id="dete">2026/08/06</p>
                <img class="ma" src="https://gyazo.com/f1403295175ebcf1d6bdbc4e1a47c192.png">

                <img class="ma" src="https://gyazo.com/1421540c21345eacaad6a11834bb02d0.png">
                <img class="ma" src="https://gyazo.com/f448a71685b6fa7ffdd6925143271e75.png">
                <img class="ma" src="https://gyazo.com/9c5e000ff410b75b1b8728d309ecf05f.png">
                <img class="ma" src="https://gyazo.com/71318ffc9f5f4946b947cdb11952578e.png">
                <img class="ma" src="https://gyazo.com/38e536f424876c94862a8e2e6b274b0f.png">
                <img class="ma" src="https://gyazo.com/b63474645a561f4be19923be7f613529.png">
                <img class="ma" src="https://gyazo.com/81b25cde9a7c653565c5732a999f20ab.png">

            </article>
        </main>

    </div>

</body>
</html>
