<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>信号機と相席純喫茶</title>
    <style>
        /* カラー変数を定義（最大5色） */
        :root {
            --bg-color: #c0a246;         /* 1. 全体背景 */
            --card-bg: #ffffff;          /* 2. カード・コンテンツ背景 */
            --text-color: #333333;       /* 3. 基本テキスト */
            --text-sub: #888888;         /* 4. サブテキスト（日付など） */
            --accent-color: #7a5c10;     /* 5. リンク・アクセントカラー */
        }

        * {
            box-sizing: border-box; /* パディングや枠線による幅崩れを完全に防ぐ */
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            font-family: Arial, sans-serif;
            color: var(--text-color);
        }

        /* 全体レイアウト用コンテナ（確実に左右横並びにする） */
        .layout-container {
            display: flex;
            flex-direction: row;        /* 確実に横並び指定 */
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;             /* 画面中央に配置 */
            gap: 20px;                  /* 左右の隙間 */
            align-items: flex-start;    /* 高さを揃えず上揃えにする */
        }

        /* 左側：作品リンク一覧（幅を固定／追尾なし） */
        .sidebar-left {
            width: 220px;
            flex-shrink: 0;             /* 右側の圧迫で潰れないように固定 */
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
        }

        .sidebar-left h2 {
            font-size: 16px;
            margin-top: 0;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 8px;
        }

        .sidebar-left ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-left li {
            margin-bottom: 12px;
        }

        .sidebar-left a {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .sidebar-left a:hover {
            text-decoration: underline;
        }

        /* 右側：メインエリア（残りの幅をすべて使う） */
        .content-right {
            flex: 1;                    /* 残り幅を自動計算して埋める */
            min-width: 0;               /* 子要素のはみ出しによる横並び崩れを防止 */
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 右上ヘッダー（スクロール時に追尾固定） */
        .sticky-header {
            position: sticky;
            top: 20px;                  /* スクロール時、画面上部20pxで固定 */
            z-index: 100;
            background-color: var(--card-bg);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sticky-header h1 {
            margin: 0;
            font-size: 20px;
        }

        .sticky-header nav a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
        }

        /* メイン作品エリア #m */
        #m {
            background-color: var(--card-bg);
            border: 10px solid var(--card-bg);
            padding: 20px;
            border-radius: 8px;
        }

        #dete {
            text-align: right;
            font-size: 12px;
            color: var(--text-sub);
        }

        .ma {
            display: block;
            width: 60%;
            max-width: 100%;
            height: auto;
            margin: 20px auto;
        }
    </style>
</head>
<body>

    <!-- 全体コンテナ（左右2カラム） -->
    <div class="layout-container category">

        <!-- 左側：作品リンク一覧（幅220px固定・スクロールで流れる） -->
        <aside class="sidebar-left category">
            <h2>作品一覧</h2>
            <ul>
                <li><a href="home.html">HOME</a></li>
                <li><a href="#work1">処女作</a></li>
                <li><a href="#work2">作品二作目</a></li>
                <li><a href="#work3">作品三作目</a></li>
            </ul>
        </aside>

      <p>ギャラリーに載せられない作品まとめ</p>


    </div>

</body>
</html>
