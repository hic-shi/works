<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">    
    <title>記事のタイトル</title>
    <meta property="og:site_name" content="HIC_SHIの本棚">
    <meta property="og:title" content="記事のタイトル">
    <meta property="og:description" content="ページの説明文">
    <meta property="og:type" content="article">
    <meta property="og:url" content="直接リンク">
    <!--<meta property="og:image" content="直接リンク">-->
    

</head>
<body id="top">

    <div class="header-nav" id="js-header-nav">
        <button class="hamburger" id="js-hamburger" aria-label="メニューを開く">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>

    <nav class="nav-menu" id="js-nav-menu">
        <div class="menu-inner">
            <a href="index.html" class="menu-btn">HOME</a>
            <a href="#top" class="menu-btn" id="js-top-btn">TOP</a>
        </div>
    </nav>

    <div class="layout-container">

        <aside class="sidebar-left" id="js-sidebar">
            <h2>記事一覧</h2>
            <div id="js-works-container"></div>
        </aside>

        <main>
            <h1 id="top">記事のタイトル</h1>
            <time id="posted_date" datetime="YYYY-MM-DD">YYYY/MM/DD</time>
            <section>
            <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Totam, optio. Praesentium est sint doloremque dolorem quos ex quas omnis repellat, accusantium exercitationem quo sequi vel, adipisci, ducimus natus nostrum placeat!</p>
            </section>
        <div id="jump"><a href="index.html">[ HOME ]</a>&nbsp<a href="#top">[ TOP ]</a></div>
         </main>

    </div>

    <script src="works.js"></script>

    <script>
        const headerNav = document.getElementById('js-header-nav');
        const hamburger = document.getElementById('js-hamburger');
        const navMenu = document.getElementById('js-nav-menu');
        const topBtn = document.getElementById('js-top-btn');

        hamburger.addEventListener('click', (e) => {
            e.stopPropagation();
            navMenu.classList.add('active');
            headerNav.classList.add('is-hidden');
        });

        topBtn.addEventListener('click', () => {
            navMenu.classList.remove('active');
            headerNav.classList.remove('is-hidden');
        });

        document.addEventListener('click', (e) => {
            if (navMenu.classList.contains('active') && !navMenu.contains(e.target) && !hamburger.contains(e.target)) {
                navMenu.classList.remove('active');
                headerNav.classList.remove('is-hidden');
            }
        });

        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        }, false);

        document.addEventListener('dragstart', (e) => {
            e.preventDefault();
        }, false);

        let touchTimer = null;
        document.addEventListener('touchstart', (e) => {
        }, { passive: true });

        document.addEventListener('touchend', () => {
            if (touchTimer) clearTimeout(touchTimer);
        });
    </script>
</body>
</html>
